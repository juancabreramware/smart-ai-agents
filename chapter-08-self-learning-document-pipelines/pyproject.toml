[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "chapter-08-self-learning-document-pipelines"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8", "pypdf>=5.0", "reportlab>=4.2"]
[project.optional-dependencies]
openai = ["openai>=1.100"]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
